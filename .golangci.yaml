version: "2"
run:
  # the grammars trazo colors with, as the Makefile's GRAMMARS lists them
  build-tags:
    - grammar_subset
    - grammar_subset_go
    - grammar_subset_gomod
    - grammar_subset_yaml
    - grammar_subset_json
    - grammar_subset_markdown
    - grammar_subset_markdown_inline
    - grammar_subset_bash
    - grammar_subset_make
    - grammar_subset_javascript
    - grammar_subset_python
    - grammar_subset_java
linters:
  default: standard # errcheck,govet,ineffassign,staticcheck,unused
  enable:
    - nolintlint
    - gocyclo
    - nestif
    - gosec
    - dupl
    - depguard

  # exclude noisy linters on test files: structural checks plus gosec, whose
  # G304 fires on tests that read temp files they just wrote under t.TempDir().
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - nestif
          - dupl
          - gosec

  settings:
    depguard:
      # libs/ holds app-agnostic packages: the app may import them, never the
      # other way round.
      rules:
        libs-agnostic:
          files:
            - "**/libs/**"
          deny:
            - pkg: github.com/candy-tools/trazo/app
              desc: libs/ must not depend on the app
            - pkg: github.com/candy-tools/trazo/internal
              desc: libs/ must not depend on the app
    nolintlint:
      # Enable to require an explanation of nonzero length after each nolint directive.
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed.
      require-specific: true
    gocyclo:
      min-complexity: 20  # Default: 30 (but we recommend 10-20)
    nestif:
      min-complexity: 5   # Default: 5

output:
  sort-order:
    - file
    - severity
    - linter
